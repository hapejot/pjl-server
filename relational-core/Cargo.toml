[package]
name = "relational-core"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
data-store = { version = "0.1.0", path = "../data-store" }
odata = { version = "0.1.0", path = "../odata" }
serde_json = "1.0.151"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1.0.104"
data-store = { version = "0.1.0", path = "../data-store", features = ["conformance"] }
