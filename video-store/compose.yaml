# video-store: Laufzeit-Stack.
#
#   db       (dauerhaft)  PostgreSQL 17 mit pgvector. Enthaelt den Store der
#                         Anwendung (Datenbank `video`). Die Migration arbeitet
#                         in einer eigenen Datenbank `video_mig` auf derselben
#                         Instanz, siehe scripts/stage.sh.
#   runtime  (dauerhaft)  OData-Server. Liest das Modell aus ddic.json (von Hand
#                         gepflegt, KEINE Generierung aus der Quelle) und
#                         schreibt nur in `db`.
#
# Die Quelldatenbank ist nicht Teil dieses Stacks. Sie wird nur ueber
# scripts/stage.sh (pg_dump) gelesen.
#
# Start:
#   docker compose -f video-store/compose.yaml up -d --build
#   OData -> http://localhost:3035/Service/$metadata
#
# Komplett neu aufsetzen (inkl. Datenbank-Volume):
#   docker compose -f video-store/compose.yaml down -v
#
# Overlay: video-store/overlay/ddic.overlay.json wird nur von `runtime` gelesen
# (Bind-Mount, wirksam nach `docker compose restart runtime`).
#
# Die Zugangsdaten gehoeren in die Umgebung, nicht in diese Datei.

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: video
      POSTGRES_PASSWORD: video
      POSTGRES_DB: video
    volumes:
      - video-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video -d video"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5001:5432"

  runtime:
    build:
      context: ..
      dockerfile: video-store/Dockerfile
      target: run
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Optionales Overlay (Listenansichten, ausgeblendete ObjectPage-Felder).
      # Relativ zur MODEL_ROOT-Quelle, ohne Overlay fehlt die Standard-Listenansicht des Videos.
      DDIC_OVERLAY: overlay/ddic.overlay.json
      # App-Assets (Fragmente, Module, Controller): <EXT_DIR>/<app>/ unter /ext/<app>/.
      MODEL_ROOT: zip:///app/app.zip
      STORE_PG_URL: postgres://video:video@db:5432/video
      PORT: "8080"
      RUST_LOG: info
    ports:
      - "3035:8080"
      - "3271:3270"
    volumes:
      - ../video-store.zip:/app/app.zip:ro
      - ./dump:/app/dump
    entrypoint: ["/app/video-runtime"]
    restart: unless-stopped

volumes:
  video-db:
