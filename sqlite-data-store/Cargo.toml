[package]
name = "sqlite-data-store"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
indexmap = { version = "2", features = ["serde", "std"] }
odata = { version = "0.1.0", path = "../odata" }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
data-store = { version = "0.1.0", path = "../data-store" }

[dev-dependencies]
tempfile = "3"

[features]
debug-tools = []
