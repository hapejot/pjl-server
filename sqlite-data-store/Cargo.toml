[package]
name = "sqlite-data-store"
version = "0.1.0"
edition = "2021"
description = "SQLite-Implementierung des in `data-store` definierten DataStore-Interfaces (Dokumentenablage mit Draft-Semantik)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
data-store = { version = "0.1.0", path = "../data-store" }
odata = { version = "0.1.0", path = "../odata" }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
tracing = "0.1.44"

[dev-dependencies]
data-store = { version = "0.1.0", path = "../data-store", features = ["conformance"] }
anyhow = "1.0.104"
tempfile = "=3.10.1"

[features]
debug-tools = []
