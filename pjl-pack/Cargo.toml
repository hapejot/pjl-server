[package]
name = "pjl-pack"
version = "0.1.0"
edition = "2021"
description = "Packt ein Verzeichnis in ein ZIP fuer zip:// (FIORI_ROOT / MODEL_ROOT)."

[dependencies]
anyhow = "1.0"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
file-repo = { version = "0.1.0", path = "../file-repo" }
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "pjl-pack"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
