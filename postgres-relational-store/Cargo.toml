[package]
name = "postgres-relational-store"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
data-store = { version = "0.1.0", path = "../data-store" }
relational-core = { version = "0.1.0", path = "../relational-core" }
odata = { version = "0.1.0", path = "../odata" }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
deadpool-postgres = "0.14"
tokio = { version = "1", features = ["rt", "macros"] }
serde_json = "1.0.151"
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[features]
# Die Verhaltenssuite braucht eine laufende Datenbank:
#
#   docker compose --profile dev up -d postgres
#   cargo test -p postgres-relational-store --features docker-tests
#
# Standardmaessig aus, damit ein `cargo test` ohne Docker gruen bleibt.
docker-tests = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.26.1", features = ["v4"] }
anyhow = "1.0.104"
data-store = { version = "0.1.0", path = "../data-store", features = ["conformance"] }
