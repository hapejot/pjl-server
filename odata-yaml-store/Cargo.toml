[package]
name = "odata_yaml_store"
version = "0.1.0"
edition = "2021"
description = "Prototyp eines OData-DataStore-Backends, das jeden Record als einzelne YAML-Datei ablegt (Vorstufe zu einer Postgres-Implementierung)."

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = {git = "https://github.com/hapejot/serde-yaml.git"}
indexmap = "=2.2.6"
hashbrown = "=0.14.5"
data-store = { version = "0.1.0", path = "../data-store" }
odata = { version = "0.1.0", path = "../odata" }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
tracing = "0.1.44"
anyhow = "1.0.104"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.20"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
data-store = { version = "0.1.0", path = "../data-store", features = ["conformance"] }
tempfile = "=3.10.1"

[features]
debug-tools = []

[[example]]
name = "demo"
path = "examples/demo.rs"
