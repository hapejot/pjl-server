[package]
name = "fiori-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["tracing"] }
clap = { version = "4.5", features = ["derive", "env"] }
data-store = { version = "0.1.0", path = "../data-store", features = ["conformance"] }
futures-util = "0.3.32"
handlebars = "6.3"
multer = "3.1.0"
odata = { version = "0.1.0", path = "../odata" }
odata_yaml_store = { version = "0.1.0", path = "../odata-yaml-store" }
quick-xml = { version = "0.41.0", features = ["serde", "serialize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
spec = { version = "0.1.0", path = "../spec" }
spec-schema = { version = "0.1.0", path = "../spec-schema" }
sqlite-relational-store = { version = "0.1.0", path = "../sqlite-relational-store" }
thiserror = "2.0.20"
tokio = { version = "1.52.3", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.10.1"
