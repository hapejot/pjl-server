[package]
name = "data-store"
version = "0.1.0"
edition = "2021"

[dependencies]
odata = { version = "0.1.0", path = "../odata" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
indexmap = { version = "2", features = ["serde"] }
anyhow = "1.0.104"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]

[features]
debug-tools = []
# Backend-uebergreifende Verhaltenssuite; in [dev-dependencies] aktivieren.
conformance = []
