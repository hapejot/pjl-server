[package]
name = "file-repo"
version = "0.1.0"
edition = "2021"
description = "Lesender Dateizugriff ueber eine Abstraktion: Verzeichnis (file://) oder ZIP im Speicher (zip://)."

[dependencies]
bytes = "1"
thiserror = "2"
tracing = "0.1.44"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
