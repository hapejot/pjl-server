packages:
  - name: crm
entities:
  - name: Account
    package: crm
    type_name: Firma
    type_name_plural: Firmen
    fields:
      - Atom:
          name: name
          label: Name
          edm_type: Edm.String
          max_length: 255
      - Atom:
          name: industry
          label: Branche
          edm_type: Edm.String
          max_length: 100
      - Atom:
          name: city
          label: Stadt
          edm_type: Edm.String
          max_length: 100
      - Atom:
          name: website
          label: Website
          edm_type: Edm.String
          max_length: 255
          link: true
  - name: Contact
    package: crm
    type_name: Kontakt
    type_name_plural: Kontakte
    fields:
      - Atom:
          name: name
          label: Name
          edm_type: Edm.String
          max_length: 255
      - Atom:
          name: email
          label: E-Mail
          edm_type: Edm.String
          max_length: 255
      - Atom:
          name: phone
          label: Telefon
          edm_type: Edm.String
          max_length: 50
  - name: Opportunity
    package: crm
    type_name: Verkaufschance
    type_name_plural: Verkaufschancen
    fields:
      - Atom:
          name: name
          label: Name
          edm_type: Edm.String
          max_length: 255
      - Atom:
          name: stage
          label: Phase
          edm_type: Edm.String
          max_length: 50
      - Atom:
          name: currency_code
          label: Währung
          edm_type: Edm.String
          max_length: 3
          value_list:
            EntityRef:
              entity_set: CurrencySet
              key_property: code
              display_property: name
              filters: []
              prefer_dialog: false
      - Measure:
          name: amount
          label: Betrag
          precision: 15
          scale: 2
          unit_field: currency_code
          kind: Currency
      - Atom:
          name: duration_unit
          label: Dauereinheit
          edm_type: Edm.String
          max_length: 3
          value_list:
            EntityRef:
              entity_set: UnitOfMeasureSet
              key_property: code
              display_property: name
              filters: []
              constant_filters:
                - target_property: dimension
                  value: time
              prefer_dialog: false
      - Measure:
          name: duration
          label: Dauer
          precision: 10
          scale: 0
          unit_field: duration_unit
          kind: Unit
      - Atom:
          name: close_date
          label: Abschlussdatum
          edm_type: Edm.Date
      - Atom:
          name: unit_code
          label: Mengeneinheit
          edm_type: Edm.String
          max_length: 3
          value_list:
            EntityRef:
              entity_set: UnitOfMeasureSet
              key_property: code
              display_property: name
              filters: []
              prefer_dialog: false
      - Measure:
          name: quantity
          label: Menge
          precision: 15
          scale: 3
          unit_field: unit_code
          kind: Unit
      - Atom:
          name: status
          label: Status
          edm_type: Edm.String
          max_length: 20
          value_list:
            FieldValueList:
              list_id: 1f057ed4-cc46-48f4-87ef-f005e060063b
              prefer_dialog: false
  - name: Currency
    package: crm
    type_name: Währung
    type_name_plural: Währungen
    fields:
      - Atom:
          name: code
          label: Code
          edm_type: Edm.String
          max_length: 3
          unit_scale_field: decimal_places
      - Atom:
          name: name
          label: Bezeichnung
          edm_type: Edm.String
          max_length: 50
      - Atom:
          name: decimal_places
          label: Nachkommastellen
          edm_type: Edm.Byte
    seed:
      - code: EUR
        decimal_places: 2
        name: Euro
      - code: USD
        decimal_places: 2
        name: US-Dollar
      - code: GBP
        decimal_places: 2
        name: Pfund Sterling
      - code: CHF
        decimal_places: 2
        name: Schweizer Franken
      - code: SEK
        decimal_places: 2
        name: Schwedische Krone
      - code: PLN
        decimal_places: 2
        name: Zloty
      - code: CZK
        decimal_places: 2
        name: Tschechische Krone
      - code: JPY
        decimal_places: 0
        name: Yen
      - code: KRW
        decimal_places: 0
        name: Won
      - code: BHD
        decimal_places: 3
        name: Bahrain-Dinar
      - code: KWD
        decimal_places: 3
        name: Kuwait-Dinar
    draft_enabled: false
  - name: UnitOfMeasure
    package: crm
    type_name: Mengeneinheit
    type_name_plural: Mengeneinheiten
    fields:
      - Atom:
          name: code
          label: Code
          edm_type: Edm.String
          max_length: 3
          unit_scale_field: decimal_places
          code_list: UnitsOfMeasure
      - Atom:
          name: name
          label: Bezeichnung
          edm_type: Edm.String
          max_length: 50
      - Atom:
          name: decimal_places
          label: Nachkommastellen
          edm_type: Edm.Byte
      - Atom:
          name: dimension
          label: Dimension
          edm_type: Edm.String
          max_length: 20
    seed:
      - code: PCS
        name: Stueck
        decimal_places: 0
        dimension: count
      - code: KG
        name: Kilogramm
        decimal_places: 3
        dimension: mass
      - code: G
        name: Gramm
        decimal_places: 0
        dimension: mass
      - code: L
        name: Liter
        decimal_places: 3
        dimension: volume
      - code: M
        name: Meter
        decimal_places: 2
        dimension: length
      - code: H87
        name: Stueck (H87)
        decimal_places: 0
        dimension: count
      - code: KWH
        name: Kilowattstunde
        decimal_places: 2
        dimension: energy
      - code: TO
        name: Tonne
        decimal_places: 3
        dimension: mass
      - code: H
        name: Stunde
        decimal_places: 0
        dimension: time
      - code: MIN
        name: Minute
        decimal_places: 0
        dimension: time
      - code: S
        name: Sekunde
        decimal_places: 0
        dimension: time
      - code: D
        name: Tag
        decimal_places: 0
        dimension: time
    draft_enabled: false
relationships:
  - name: contact_account_id
    one: Account
    one_field: _Contacts
    many: Contact
    many_property: account
    package: crm
    one_label: Kontakte
    many_label: Firma
  - name: opportunity_account_id
    one: Account
    one_field: _Opportunities
    many: Opportunity
    many_property: account
    package: crm
    one_label: Verkaufschancen
    many_label: Firma
apps:
  - name: accounts
    title: Firmen
    main_entity: Account
    subtitle: Alle Kunden
    package:
      name: crm
  - name: contacts
    title: Kontakte
    main_entity: Contact
    subtitle: Ansprechpartner
    package:
      name: crm
  - name: opportunities
    title: Verkaufschancen
    main_entity: Opportunity
    subtitle: Verkaufschancen
    package:
      name: crm
value_lists:
  - id: 1f057ed4-cc46-48f4-87ef-f005e060063b
    name: OpportunityStage
    values:
      - code: open
        label: Offen
        sort: 1
      - code: won
        label: Gewonnen
        sort: 2
      - code: lost
        label: Verloren
        sort: 3
