[package]
name = "json-to-ddic"
version = "0.1.0"
edition = "2024"
description = "Infer an initial PJL data dictionary from example JSON or XML"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
quick-xml = "0.41"
serde_json = "1.0.150"
spec = { path = "../spec" }
spec-schema = { path = "../spec-schema" }

[dev-dependencies]
tempfile = "3"
