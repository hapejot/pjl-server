[package]
name = "odata_yaml_store"
version = "0.1.0"
edition = "2021"
description = "Prototyp eines OData-DataStore-Backends, das jeden Record als einzelne YAML-Datei ablegt (Vorstufe zu einer Postgres-Implementierung)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = {git = "https://github.com/hapejot/serde-yaml.git"}
indexmap = "=2.2.6"
hashbrown = "=0.14.5"

[dev-dependencies]
tempfile = "=3.10.1"

[features]
debug-tools = []

[[example]]
name = "demo"
path = "examples/demo.rs"
